name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK" -path '*/bin/sdkmanager' | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-37" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Domain tests
        run: ./gradlew :domain:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Name artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk matchday-debug.apk
          sha256sum matchday-debug.apk > matchday-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: matchday-debug-apk
          path: |
            matchday-debug.apk
            matchday-debug.apk.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK" -path '*/bin/sdkmanager' | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-37" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MATCHDAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > matchday-release.jks
          fi

      - name: Build release APK
        env:
          MATCHDAY_KEYSTORE: matchday-release.jks
          MATCHDAY_KEYSTORE_PASSWORD: ${{ secrets.MATCHDAY_KEYSTORE_PASSWORD }}
          MATCHDAY_KEY_ALIAS: ${{ secrets.MATCHDAY_KEY_ALIAS }}
          MATCHDAY_KEY_PASSWORD: ${{ secrets.MATCHDAY_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name release artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "matchday-${VERSION}.apk"
          sha256sum "matchday-${VERSION}.apk" > "matchday-${VERSION}.apk.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            matchday-*.apk
            matchday-*.apk.sha256
